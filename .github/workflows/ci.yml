name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint and debug build
        run: ./gradlew --no-configuration-cache testDebugUnitTest lintDebug assembleDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: medwi-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Smoke test APK manifest and signature
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          tools=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$tools" verify "$apk"
          "${tools%/*}/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-info"
          grep -q "package: name='br.com.butialabs.medwi" "$RUNNER_TEMP/apk-info"
          grep -q '^launchable-activity:' "$RUNNER_TEMP/apk-info"
