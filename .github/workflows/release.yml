name: Release

# Push a tag such as 0.1.0 (major.minor.patch, no "v") to publish a GitHub Release
# with the signed APK (Obtainium users install it from there). F-Droid builds the tag
# from source and signs it with its own key.
# versionName in app/build.gradle.kts must match the tag.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Check tag, versionName and changelog
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME=$(sed -nE 's/^\s*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          CODE=$(sed -nE 's/^\s*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts)
          IFS=. read -r MAJOR MINOR PATCH <<< "$TAG"
          EXPECTED=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          [ "$TAG" = "$NAME" ] || { echo "::error::Tag $TAG != versionName $NAME"; exit 1; }
          [ "$CODE" = "$EXPECTED" ] || { echo "::error::versionCode $CODE != $EXPECTED for $TAG"; exit 1; }
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          [ -f "$CHANGELOG" ] || { echo "::error::Missing $CHANGELOG"; exit 1; }
          echo "changelog=$CHANGELOG" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        env:
          MEDWI_KEYSTORE_BASE64: ${{ secrets.MEDWI_KEYSTORE_BASE64 }}
        run: |
          [ -n "$MEDWI_KEYSTORE_BASE64" ] || { echo "::error::Secret MEDWI_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$MEDWI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "MEDWI_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build signed release APK
        env:
          MEDWI_KEYSTORE_PASSWORD: ${{ secrets.MEDWI_KEYSTORE_PASSWORD }}
          MEDWI_KEY_ALIAS: ${{ secrets.MEDWI_KEY_ALIAS }}
          MEDWI_KEY_PASSWORD: ${{ secrets.MEDWI_KEY_PASSWORD }}
        run: ./gradlew --no-configuration-cache testDebugUnitTest assembleRelease

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/medwi-${GITHUB_REF_NAME}.apk"
          cd dist && sha256sum "medwi-${GITHUB_REF_NAME}.apk" > "medwi-${GITHUB_REF_NAME}.apk.sha256"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Medwi ${{ github.ref_name }}
          body_path: ${{ steps.version.outputs.changelog }}
          files: |
            dist/medwi-${{ github.ref_name }}.apk
            dist/medwi-${{ github.ref_name }}.apk.sha256
